name: Visual regression

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "playwright-fixture.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: "https://dkpxjivoupqpmvzwxpef.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrcHhqaXZvdXBxcG12end4cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDc2MjAsImV4cCI6MjA5MzU4MzYyMH0.wYGKqj6Q7E1M_rQMNHuchOHAVV04WqyozEK937u1VBo"

jobs:
  visual:
    # Pinned: Playwright 1.57 can't install Chromium on ubuntu-latest (Ubuntu 26.04) since 19 Nov 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Playwright (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: bun run test:visual:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
