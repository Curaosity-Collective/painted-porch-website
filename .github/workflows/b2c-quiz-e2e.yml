name: B2C quiz E2E (nightly)

on:
  schedule:
    # 07:15 UTC daily (~03:15 ET). Catches drift overnight without blocking PRs.
    - cron: "15 7 * * *"
  pull_request:
    # Also run on PRs that touch the quiz code or this workflow.
    paths:
      - "src/data/pathFinderQuiz.ts"
      - "src/components/pps/quiz/**"
      - "src/pages/pps/StartHere.tsx"
      - "e2e/b2c-quiz.spec.ts"
      - "e2e/b2c-quiz-keyboard.spec.ts"
      - "playwright.config.ts"
      - "playwright-fixture.ts"
      - ".github/workflows/b2c-quiz-e2e.yml"
  workflow_dispatch:

jobs:
  b2c-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Playwright (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: Print resolved Playwright config and installed packages
        run: |
          echo "=== Installed packages ==="
          bun pm ls
          echo "=== Playwright version ==="
          bunx playwright --version
          echo "=== Resolved Playwright config ==="
          cat playwright.config.ts

      - name: Run B2C quiz E2E (with auto-retry for transient failures)
        id: run_tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 20
          command: bun run test:e2e:b2c:ci

      - name: Report retry summary
        if: always()
        env:
          STEP_ATTEMPTS: ${{ steps.run_tests.outputs.total_attempts }}
          STEP_OUTCOME: ${{ steps.run_tests.outcome }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          ATTEMPTS="${STEP_ATTEMPTS:-1}"
          {
            echo "## B2C quiz E2E — retry report"
            echo ""
            echo "- Step attempts: $ATTEMPTS"
            echo "- Step outcome: $STEP_OUTCOME"
            echo "- Workflow run attempt: $RUN_ATTEMPT"
            echo "- Current run: $SERVER/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT"
            if [ "$RUN_ATTEMPT" -gt 1 ]; then
              echo "- Previous workflow attempts (re-runs):"
              for i in $(seq 1 $((RUN_ATTEMPT - 1))); do
                echo "  - $SERVER/$REPO/actions/runs/$RUN_ID/attempts/$i"
              done
            fi
            if [ "$ATTEMPTS" -gt 1 ] && [ "$STEP_OUTCOME" = "success" ]; then
              echo ""
              echo "Passed after $ATTEMPTS attempt(s); earlier attempts within this job failed transiently."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: b2c-quiz-playwright-report
          path: playwright-report/
          retention-days: 14

  cross-browser-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Playwright (Chromium, Firefox, WebKit)
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run keyboard tests across Chromium, Firefox, and WebKit (with auto-retry)
        id: run_tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 20
          command: bun run test:e2e:keyboard:all

      - name: Report retry summary
        if: always()
        env:
          STEP_ATTEMPTS: ${{ steps.run_tests.outputs.total_attempts }}
          STEP_OUTCOME: ${{ steps.run_tests.outcome }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          ATTEMPTS="${STEP_ATTEMPTS:-1}"
          {
            echo "## Cross-browser keyboard — retry report"
            echo ""
            echo "- Step attempts: $ATTEMPTS"
            echo "- Step outcome: $STEP_OUTCOME"
            echo "- Workflow run attempt: $RUN_ATTEMPT"
            echo "- Current run: $SERVER/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT"
            if [ "$RUN_ATTEMPT" -gt 1 ]; then
              echo "- Previous workflow attempts (re-runs):"
              for i in $(seq 1 $((RUN_ATTEMPT - 1))); do
                echo "  - $SERVER/$REPO/actions/runs/$RUN_ID/attempts/$i"
              done
            fi
            if [ "$ATTEMPTS" -gt 1 ] && [ "$STEP_OUTCOME" = "success" ]; then
              echo ""
              echo "Passed after $ATTEMPTS attempt(s); earlier attempts within this job failed transiently."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-keyboard-report
          path: playwright-report/
          retention-days: 14
