name: Block oversized & video files

# Gates every push and PR. Fails the build if any tracked file is a video
# (.mp4 .mov .webm .avi .mkv .m4v) or exceeds the GitHub-friendly size cap
# (default 5 MB; GitHub hard-rejects >100 MB). Videos belong in the
# `site-videos` Cloud Storage bucket, managed via /admin/videos.
#
# Local equivalent: `bun run repo:check-large-files`

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check-large-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run large-file & video guardrail
        env:
          # Stay well under GitHub's 100 MB hard limit and 50 MB warn line.
          MAX_FILE_SIZE_MB: '5'
        run: node scripts/check-large-files.mjs
