name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    # Lovable sync branches too: their checks gate the automatic merge (lovable-sync.yml).
    branches: [main, "lovable-sync", "lovable-sync-*"]

env:
  VITE_SUPABASE_URL: "https://dkpxjivoupqpmvzwxpef.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrcHhqaXZvdXBxcG12end4cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDc2MjAsImV4cCI6MjA5MzU4MzYyMH0.wYGKqj6Q7E1M_rQMNHuchOHAVV04WqyozEK937u1VBo"

jobs:
  test:
    name: Run Vitest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full Vitest suite
        run: bunx vitest run

  contact-scroll-a11y-regression:
    name: Contact, scroll, and a11y regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run contact/scroll/a11y regression suites
        run: |
          bunx vitest run \
            src/test/contact-and-optin-safety.test.ts \
            src/test/scroll-and-anchor-behavior.test.ts \
            src/test/a11y-key-pages-coverage.test.ts
