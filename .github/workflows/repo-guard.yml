name: Repo guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-large-files:
    name: Block large or video files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Block videos and oversized files
        run: node scripts/check-large-files.mjs
