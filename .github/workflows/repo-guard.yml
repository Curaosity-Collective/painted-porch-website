name: Repo guard

on:
  pull_request:
    branches: [main]
  push:
    # Lovable sync branches too: their checks gate the automatic merge (lovable-sync.yml).
    branches: [main, "lovable-sync", "lovable-sync-*"]

jobs:
  check-large-files:
    name: Block large or video files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Block videos and oversized files
        run: node scripts/check-large-files.mjs

  check-public-docs:
    name: Block Markdown in public assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Block Markdown under public/
        run: npm run repo:check-public-docs
  check-migrations:
    name: Migration records (PPS-DEC-0029)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch the base branch
        if: github.ref != 'refs/heads/main'
        run: git fetch --depth=1 origin "${{ github.base_ref || 'main' }}"

      - name: Check migration names, status lines and applied files
        env:
          BASE_REF: ${{ github.ref != 'refs/heads/main' && format('origin/{0}', github.base_ref || 'main') || '' }}
        run: node scripts/check-migrations.mjs

  lovable-sync-first:
    # Edits made in the Lovable editor go live from Lovable's own copy and reach this
    # repo on lovable-sync-* branches. A pull request merged ahead of them makes main
    # older than the live site, and Lovable then takes that older main (25 Nov 2026,
    # PR #69). PPS Admin, 2026-11-25: "Merge Lovable's pending sync into main first,
    # now and before any future merge, so main always matches the live editor".
    name: Lovable edits are on main first
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail while the newest Lovable sync has commits this merge lacks
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin '+refs/heads/lovable-sync-*:refs/remotes/origin/lovable-sync-*'
          newest=$(git for-each-ref --sort=-committerdate --count=1 --format='%(refname:short)' 'refs/remotes/origin/lovable-sync-*')
          if [ -z "$newest" ]; then
            echo "No lovable-sync-* branch exists; nothing from Lovable is waiting."
            exit 0
          fi
          missing=$(git rev-list --count "HEAD..${newest}")
          if [ "$missing" != "0" ]; then
            echo "::error title=Lovable edits not on main::${newest} has ${missing} commit(s) that this merge would leave out. Merge that branch's pull request into main first, then update this branch from main and re-run this check."
            git log --oneline --max-count=20 "HEAD..${newest}"
            exit 1
          fi
          echo "${newest} is fully contained in this merge."

  main-pr-audit:
    name: Verify main changes came through a PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every pushed commit has a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push; no predecessor to audit."
            exit 0
          fi
          failed=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              --jq '[.[] | select(.merged_at != null)] | length')
            if [ "$count" = "0" ]; then
              echo "::error title=Direct push to main::Commit ${sha} is not associated with a merged pull request."
              failed=1
            else
              echo "Commit ${sha} has a merged pull request."
            fi
          done < <(git rev-list "${BEFORE}..${AFTER}")
          exit "$failed"
