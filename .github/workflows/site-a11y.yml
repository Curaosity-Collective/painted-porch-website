name: Site accessibility (axe)

on:
  schedule:
    # 07:45 UTC daily — runs after the B2C nightly so failures are easier to triage.
    - cron: "45 7 * * *"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "tailwind.config.ts"
      - "src/index.css"
      - "e2e/site-a11y.spec.ts"
      - "playwright.config.ts"
      - "playwright-fixture.ts"
      - ".github/workflows/site-a11y.yml"
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Playwright (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: Print resolved Playwright config and installed packages
        run: |
          echo "=== Installed packages ==="
          bun pm ls
          echo "=== Playwright version ==="
          bunx playwright --version
          echo "=== Resolved Playwright config ==="
          cat playwright.config.ts

      - name: Run site-wide axe sweep (with auto-retry for transient failures)
        id: run_tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 20
          command: bun run test:a11y:ci

      - name: Report retry summary
        if: always()
        env:
          STEP_ATTEMPTS: ${{ steps.run_tests.outputs.total_attempts }}
          STEP_OUTCOME: ${{ steps.run_tests.outcome }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          ATTEMPTS="${STEP_ATTEMPTS:-1}"
          {
            echo "## Site a11y (axe) — retry report"
            echo ""
            echo "- Step attempts: $ATTEMPTS"
            echo "- Step outcome: $STEP_OUTCOME"
            echo "- Workflow run attempt: $RUN_ATTEMPT"
            echo "- Current run: $SERVER/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT"
            if [ "$RUN_ATTEMPT" -gt 1 ]; then
              echo "- Previous workflow attempts (re-runs):"
              for i in $(seq 1 $((RUN_ATTEMPT - 1))); do
                echo "  - $SERVER/$REPO/actions/runs/$RUN_ID/attempts/$i"
              done
            fi
            if [ "$ATTEMPTS" -gt 1 ] && [ "$STEP_OUTCOME" = "success" ]; then
              echo ""
              echo "Passed after $ATTEMPTS attempt(s); earlier attempts within this job failed transiently."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-a11y-playwright-report
          path: playwright-report/
          retention-days: 14
