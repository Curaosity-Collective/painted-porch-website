        <h1>Build an Organization That Can Do Epic ShIFt</h1>
        <p>You have a vision for who your organization can become next. Is that future being authored with intention, or inherited through assumption? <strong>Painted Porch Strategies</strong> partners with leaders at Phase Zero™, before the next major decision hardens into execution.</p>

        <h2>Every major shIFt changes three things at once</h2>
        <p>Before anything is built, we read all three Painted Porch Pillars™:</p>
        <ul>
          <li><strong>Cultural Cornerstone</strong> — leadership, culture, values, and the relationships that shape how your organization leads, decides, and evolves.</li>
          <li><strong>Operational Frame</strong> — systems, workflows, structures, and the decision paths that move strategy from intention into reality.</li>
          <li><strong>Living Ecosystem</strong> — the individual and collective capacity, judgment, and communication that keep a meaningful shIFt going.</li>
        </ul>

        <h2>The P.A.T.H.™: four stages, three ShIFts</h2>
        <p>The P.A.T.H. is the four stages of change: Prepare, Align, Take Off, Habits.</p>
        <ul>
          <li><strong>Envision ShIFt</strong> (Prepare) — the Epic ShIFt Organizational Appraisal. <a href="https://onthepaintedporch.com/envision-shift">Explore Envision ShIFt</a>.</li>
          <li><strong>Architect ShIFt</strong> (Align) — author the direction, then fortify the pillars that need to hold first. <a href="https://onthepaintedporch.com/architect-shift">Explore Architect ShIFt</a>.</li>
          <li><strong>Embody ShIFt</strong> (Take Off and Habits) — make change a continuous practice. <a href="https://onthepaintedporch.com/embody-shift">Explore Embody ShIFt</a>.</li>
        </ul>
        <p>Every journey starts with a Clarity Call: 60 minutes with Amy to read whether your current architecture can carry the shIFt. <a href="https://onthepaintedporch.com/contact">Start with a Clarity Call</a>.</p>
