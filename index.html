        <h1>Painted Porch Strategies — Architect Extraordinary Outcomes</h1>
        <p><strong>Painted Porch Strategies</strong> partners with leaders and organizations at the moment of strategic authorship — before decisions are made and before initiatives get scoped. Founded by Amy Yackowski, PPS brings 20+ years of change origination experience to executives ready to architect market-leading transformation.</p>

        <h2>What we do</h2>
        <p>We partner with C-suite leaders and teams through three signature frameworks:</p>
        <ul>
          <li><strong>Phase Zero™</strong> — Strategic positioning and architectural design before implementation begins.</li>
          <li><strong>P.A.T.H.™</strong> (Prepare, Align, Take Off, Habit) — The execution methodology for sustained change.</li>
          <li><strong>The Painted Porch Pillars™</strong> — Foundational Architecture, Operational Frame, and Living Ecosystem: the load-bearing structure of adaptive organizations.</li>
        </ul>

        <h2>The three-track ecosystem</h2>
